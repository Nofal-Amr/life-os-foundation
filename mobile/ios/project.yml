# XcodeGen spec for the Life OS iPhone app.
# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
name: LifeOS
options:
  bundleIdPrefix: app.lifeos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  LifeOS:
    type: application
    platform: iOS
    sources:
      - path: LifeOS
    info:
      path: LifeOS/Info.plist
      properties:
        CFBundleDisplayName: Life OS
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        # Service workers (offline) and full storage in WKWebView need the
        # site listed as an app-bound domain.
        WKAppBoundDomains:
          - lifeos0.vercel.app
        CFBundleURLTypes:
          - CFBundleURLName: app.lifeos.ios
            CFBundleURLSchemes:
              - lifeos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lifeos.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to attach, such as a receipt or a profile picture.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose a photo to attach, such as a profile picture.
